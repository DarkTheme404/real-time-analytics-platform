version: '3.8'

services:
  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/analytics.json
    depends_on:
      prometheus:
        condition: service_healthy

  # Application Services
  ingester:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["go", "run", "./cmd/ingester"]
    ports:
      - "9090:9090"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: analytics-events
      KAFKA_CONSUMER_GROUP: analytics-platform
      KAFKA_DLQ_TOPIC: analytics-events-dlq
      CLICKHOUSE_DSN: tcp://clickhouse:9000/analytics?username=default&password=
      REDIS_ADDR: redis:6379
      LOG_LEVEL: debug
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder-api
    command: ["go", "run", "./cmd/api"]
    ports:
      - "8080:8080"
      - "9093:9090"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: analytics-events
      KAFKA_DLQ_TOPIC: analytics-events-dlq
      CLICKHOUSE_DSN: tcp://clickhouse:9000/analytics?username=default&password=
      REDIS_ADDR: redis:6379
      API_PORT: "8080"
      METRICS_PORT: "9090"
      LOG_LEVEL: debug
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder-worker
    command: ["go", "run", "./cmd/worker"]
    ports:
      - "9094:9090"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: analytics-events
      KAFKA_CONSUMER_GROUP: analytics-worker
      KAFKA_DLQ_TOPIC: analytics-events-dlq
      CLICKHOUSE_DSN: tcp://clickhouse:9000/analytics?username=default&password=
      REDIS_ADDR: redis:6379
      WORKER_BATCH_SIZE: "1000"
      WORKER_FLUSH_INTERVAL: 5s
      LOG_LEVEL: debug
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
  redis-data:
  grafana-data:

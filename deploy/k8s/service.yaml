apiVersion: v1
kind: Service
metadata:
  name: analytics-ingester
  labels:
    app: analytics-ingester
    component: ingester
spec:
  type: ClusterIP
  selector:
    app: analytics-ingester
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  labels:
    app: analytics-api
    component: api
spec:
  type: ClusterIP
  selector:
    app: analytics-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-worker
  labels:
    app: analytics-worker
    component: worker
spec:
  type: ClusterIP
  selector:
    app: analytics-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
